user www-data;
error_log /dev/null crit;
pid /run/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
  server {
    listen 80;
    listen [::]:80;
    server_name app.example;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://app.example$request_uri; }
  }
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  error_log /dev/null crit;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  sendfile on;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;
  map $binary_remote_addr $client_rate_key {
    default $binary_remote_addr;
    "~(?s)^(?<ipv6_prefix>.{8}).{8}$" $ipv6_prefix;
  }
  limit_req_zone $client_rate_key zone=challenges:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=reports:10m rate=5r/s;
  limit_req_zone $client_rate_key zone=places:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=lookups:10m rate=2r/s;
  limit_req_zone $client_rate_key zone=address_flags:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=withdrawals:10m rate=2r/s;
  limit_req_zone $client_rate_key zone=api_reads:10m rate=5r/s;
  limit_req_zone $client_rate_key zone=events:10m rate=10r/s;
  limit_req_zone $client_rate_key zone=assets:10m rate=30r/s;
  limit_req_zone $client_rate_key zone=downloads:10m rate=1r/s;
  limit_conn_zone $client_rate_key zone=connections:10m;
  limit_conn_zone $server_name zone=global_connections:1m;
  limit_conn_zone $server_name zone=download_connections:1m;
  map $http_origin $cors_origin { default ""; "https://localhost" "https://localhost"; }
  upstream api {
    zone api 64k;
    server 127.0.0.1:3001;
  }
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/app.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_name app.example;
    root /opt/bor-czuwa/current/build;
    # The app host never serves the public face, so every document keeps the exclusion.
    set $document_robots "noindex, nofollow";
    limit_conn connections 40;
    limit_conn global_connections 100;
    limit_conn_status 429;
    keepalive_timeout 5s;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 8k;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /opt/bor-czuwa/current/build/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req_status 429;
    error_page 429 = @throttled;
    location @throttled {
      include /opt/bor-czuwa/current/build/security-headers.conf;
      default_type application/json;
      add_header Retry-After 1 always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Expose-Headers Retry-After always;
      add_header Vary Origin always;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      return 429 '{"error":"try_again"}';
    }
    location = /api/health {
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/ready {
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/places {
      limit_req zone=places burst=2 nodelay;
      proxy_pass http://api;
    }
    location = /api/recipients {
      limit_req zone=lookups burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/area-places {
      limit_req zone=lookups burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/reports {
      limit_req zone=reports burst=20 nodelay;
      proxy_pass http://api;
    }
    location = /api/recipient-address-flags {
      limit_req zone=address_flags burst=5 nodelay;
      proxy_pass http://api;
    }
    location = /api/challenge {
      limit_req zone=challenges burst=5 nodelay;
      proxy_pass http://api;
    }
    location = /api/worker-status {
      return 404;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+/events$ {
      limit_req zone=events burst=20 nodelay;
      proxy_pass http://api;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+/findings$ {
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+$ {
      limit_req zone=withdrawals burst=10 nodelay;
      proxy_pass http://api;
    }
    location ~ "^/api/geodata/(?<snapshot_id>[a-z0-9-]{1,80})/ambony$" {
      limit_req zone=downloads burst=2 nodelay;
      limit_conn connections 2;
      limit_conn global_connections 100;
      limit_conn download_connections 2;
      default_type application/geo+json-seq;
      alias /var/lib/bor-czuwa/geodata-extracts/$snapshot_id.geojsonseq;
      include /opt/bor-czuwa/current/build/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Disposition 'attachment; filename="osm-stands-$snapshot_id.geojsonseq"';
      add_header Link '<https://opendatacommons.org/licenses/odbl/1-0/>; rel="license", <https://www.openstreetmap.org/copyright>; rel="source"';
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'If-None-Match, If-Modified-Since, Range' always;
      add_header Vary Origin always;
      if ($request_method = OPTIONS) { return 204; }
    }
    location /api/ {
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    # A location with its own add_header drops the server-level one, so each repeats it.
    location ^~ /_app/immutable/ {
      include /opt/bor-czuwa/current/build/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    # Entry documents, version.json, the worker and unhashed files revalidate on every use.
    location / {
      include /opt/bor-czuwa/current/build/security-headers.conf;
      limit_req zone=assets burst=100 nodelay;
      add_header X-Robots-Tag $document_robots always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
    location = /service-worker.js {
      include /opt/bor-czuwa/current/build/security-headers.conf;
      limit_req zone=assets burst=100 nodelay;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-cache" always;
    }
  }
}

