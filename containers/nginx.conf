worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  error_log /dev/null crit;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  sendfile on;
  tcp_nopush on;
  reset_timedout_connection on;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  client_body_buffer_size 16k;
  server_names_hash_bucket_size 128;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;
  map $binary_remote_addr $client_rate_key {
    default $binary_remote_addr;
    "~(?s)^(?<ipv6_prefix>.{8}).{8}$" $ipv6_prefix;
  }
  limit_req_zone $client_rate_key zone=challenges:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=reports:10m rate=5r/s;
  limit_req_zone $client_rate_key zone=places:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=lookups:10m rate=2r/s;
  limit_req_zone $client_rate_key zone=address_flags:10m rate=1r/s;
  limit_req_zone $client_rate_key zone=withdrawals:10m rate=2r/s;
  limit_req_zone $client_rate_key zone=api_reads:10m rate=5r/s;
  limit_req_zone $client_rate_key zone=events:10m rate=10r/s;
  limit_req_zone $client_rate_key zone=assets:10m rate=30r/s;
  limit_req_zone $client_rate_key zone=downloads:10m rate=1r/s;
  limit_conn_zone $client_rate_key zone=connections:10m;
  limit_conn_zone $server_name zone=global_connections:1m;
  limit_conn_zone $server_name zone=download_connections:1m;
  # Routes that take a request body get their own pool: a client dripping bodies under
  # client_body_timeout holds a connection for as long as it likes, so they must not be able to
  # spend the connections the page, the assets and the health checks share.
  limit_conn_zone $server_name zone=upload_connections:1m;
  map $http_origin $cors_origin { default ""; "https://localhost" "https://localhost"; }
  # The landing's page-opening count (ticket 14).
  # Only the landing's ten pages count, and only as the whole query "?p=<path>". Anything else
  # is dropped, so no text a visitor chooses ever reaches the counter. It reads $request_uri, which
  # a subrequest (the auth_request below) inherits from the request that caused it.
  map $request_uri $stats_path {
    default "";
    "~^/_stats/website\?p=(?<counted_path>/|/prywatnosc/|/regulamin/|/o-projekcie/|/wesprzyj/|/en/|/en/privacy/|/en/terms/|/en/about/|/en/support/)$" $counted_path;
  }
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
  # GoatCounter on the same host, bound to loopback. Nothing but /count is ever proxied to it, so
  # its dashboard and login are not reachable from the internet.
  upstream goatcounter {
    server 127.0.0.1:8081;
  }
  upstream api {
    zone api 64k;
    server app:3001 resolve;
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # The app host never serves the public face, so every document keeps the exclusion.
    set $document_robots "noindex, nofollow";
    limit_conn connections 40;
    limit_conn global_connections 100;
    limit_conn_status 429;
    keepalive_timeout 5s;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 8k;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req_status 429;
    error_page 429 = @throttled;
    # nginx's own error pages name the server in their body; these say only the status.
    error_page 400 = @e400;
    error_page 403 = @e403;
    error_page 404 = @e404;
    error_page 405 = @e405;
    error_page 408 = @e408;
    error_page 413 = @e413;
    error_page 414 = @e414;
    error_page 431 494 = @e431;
    error_page 500 = @e500;
    error_page 502 = @e502;
    error_page 503 = @e503;
    error_page 504 = @e504;
    # API paths answer a JSON status, every other path a plain-text one; neither names the server.
    # A location with its own add_header drops the server-level ones, so each repeats them.
    location @e400 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/400 last; }
      default_type text/plain;
      return 400 "Bad request\n";
    }
    location = /_e/400 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 400 '{"error":"bad_request"}';
    }
    location @e403 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/403 last; }
      default_type text/plain;
      return 403 "Forbidden\n";
    }
    location = /_e/403 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 403 '{"error":"forbidden"}';
    }
    location @e404 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/404 last; }
      default_type text/plain;
      return 404 "Not found\n";
    }
    location = /_e/404 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 404 '{"error":"not_found"}';
    }
    location @e405 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/405 last; }
      default_type text/plain;
      return 405 "Method not allowed\n";
    }
    location = /_e/405 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 405 '{"error":"method_not_allowed"}';
    }
    location @e408 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/408 last; }
      default_type text/plain;
      return 408 "Request timeout\n";
    }
    location = /_e/408 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 408 '{"error":"request_timeout"}';
    }
    location @e413 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/413 last; }
      default_type text/plain;
      return 413 "Request too large\n";
    }
    location = /_e/413 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 413 '{"error":"too_large"}';
    }
    location @e414 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/414 last; }
      default_type text/plain;
      return 414 "Request too large\n";
    }
    location = /_e/414 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 414 '{"error":"too_large"}';
    }
    location @e431 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/431 last; }
      default_type text/plain;
      return 431 "Request too large\n";
    }
    location = /_e/431 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 431 '{"error":"too_large"}';
    }
    location @e500 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/500 last; }
      default_type text/plain;
      return 500 "Server error\n";
    }
    location = /_e/500 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 500 '{"error":"server_error"}';
    }
    location @e502 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/502 last; }
      default_type text/plain;
      return 502 "Unavailable\n";
    }
    location = /_e/502 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 502 '{"error":"unavailable"}';
    }
    location @e503 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/503 last; }
      default_type text/plain;
      return 503 "Unavailable\n";
    }
    location = /_e/503 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 503 '{"error":"unavailable"}';
    }
    location @e504 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      if ($uri ~ ^/api/) { rewrite ^ /_e/504 last; }
      default_type text/plain;
      return 504 "Unavailable\n";
    }
    location = /_e/504 {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      default_type application/json;
      return 504 '{"error":"unavailable"}';
    }
    # Dotfiles, editor leftovers and backups answer exactly like a missing file.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* (?:~|\.(?:bak|old|orig|save|swp|tmp|sql|env|ini|log))$ { return 404; }
    location @throttled {
      include /etc/nginx/security-headers.conf;
      default_type application/json;
      add_header Retry-After 1 always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Expose-Headers Retry-After always;
      add_header Vary Origin always;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      return 429 '{"error":"try_again"}';
    }
    location = /api/health {
      if ($request_method !~ ^(?:GET|OPTIONS)$) { return 405; }
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/ready {
      if ($request_method !~ ^(?:GET|OPTIONS)$) { return 405; }
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location = /api/places {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=places burst=2 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location = /api/recipients {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=lookups burst=10 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location = /api/area-places {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=lookups burst=10 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location = /api/reports {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=reports burst=20 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location = /api/recipient-address-flags {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=address_flags burst=5 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location = /api/challenge {
      if ($request_method !~ ^(?:GET|OPTIONS)$) { return 405; }
      limit_req zone=challenges burst=5 nodelay;
      proxy_pass http://api;
    }
    # One empty POST per landing page opening. The counter is told by a subrequest (auth_request),
    # and the visitor is always answered 204 by this location itself, so nothing the counter sends
    # back (its image, cookies, headers) can reach them. The counter gets a GET for the path and a
    # fixed site label, and nothing that identifies the visitor: no address, browser, referrer,
    # cookie or origin. Only the ten pages are forwarded; any other ?p= is answered and dropped.
    location = /_stats/website {
      if ($request_method !~ ^(?:POST)$) { return 405; }
      limit_req zone=events burst=10 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-store" always;
      if ($stats_path = "") { return 204; }
      auth_request /_stats/forward;
      error_page 401 403 404 500 502 503 504 = @stats_done;
      error_page 405 = @e405;
      error_page 429 = @throttled;
      try_files /_stats/none =204;
    }
    location = /_stats/forward {
      internal;
      # Nothing of the visitor's request is forwarded, only the two headers set here: the body and
      # every incoming header (address chain, referrer, cookie, authorization, language) stay behind.
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Host website.stats.bor-czuwa.local;
      # A complete browser string: GoatCounter files a bare "Mozilla/5.0" under bots and counts nothing.
      proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
      proxy_pass http://goatcounter/count?p=$stats_path;
    }
    location @stats_done {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      return 204;
    }
    location = /api/worker-status {
      return 404;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+/events$ {
      if ($request_method !~ ^(?:POST|OPTIONS)$) { return 405; }
      limit_req zone=events burst=20 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+/findings$ {
      if ($request_method !~ ^(?:GET|OPTIONS)$) { return 405; }
      limit_req zone=api_reads burst=10 nodelay;
      proxy_pass http://api;
    }
    location ~ ^/api/reports/[a-fA-F0-9-]+$ {
      if ($request_method !~ ^(?:DELETE|OPTIONS)$) { return 405; }
      limit_req zone=withdrawals burst=10 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    location ~ "^/api/geodata/(?<snapshot_id>[a-z0-9-]{1,80})/ambony$" {
      limit_req zone=downloads burst=2 nodelay;
      limit_conn connections 2;
      limit_conn global_connections 100;
      limit_conn download_connections 2;
      default_type application/geo+json-seq;
      alias /var/lib/bor-czuwa/geodata-extracts/$snapshot_id.geojsonseq;
      if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) { return 405; }
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Disposition 'attachment; filename="osm-stands-$snapshot_id.geojsonseq"';
      add_header Link '<https://opendatacommons.org/licenses/odbl/1-0/>; rel="license", <https://www.openstreetmap.org/copyright>; rel="source"';
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'If-None-Match, If-Modified-Since, Range' always;
      add_header Vary Origin always;
      if ($request_method = OPTIONS) { return 204; }
    }
    location /api/ {
      if ($request_method !~ ^(?:GET|POST|DELETE|OPTIONS)$) { return 405; }
      limit_req zone=api_reads burst=10 nodelay;
      limit_conn connections 4;
      limit_conn upload_connections 40;
      proxy_pass http://api;
    }
    # A location with its own add_header drops the server-level one, so each repeats it.
    location ^~ /_app/immutable/ {
      if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    # Entry documents, version.json, the worker and unhashed files revalidate on every use.
    location / {
      if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
      include /etc/nginx/security-headers.conf;
      limit_req zone=assets burst=100 nodelay;
      add_header X-Robots-Tag $document_robots always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
    location = /service-worker.js {
      if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
      include /etc/nginx/security-headers.conf;
      limit_req zone=assets burst=100 nodelay;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-cache" always;
    }
  }
}
